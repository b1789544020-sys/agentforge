<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E" />
    <title>AgentForge</title>
    <script>
      // Synchronously apply the saved language BEFORE React mounts, so the
      // browser never paints a flash of the wrong language and so the
      // <html lang> attribute is correct from the very first frame.
      (function () {
        try {
          var saved = localStorage.getItem("agentforge.lang");
          var nav = (navigator.language || "en").toLowerCase();
          var lang = saved === "en" || saved === "zh"
            ? saved
            : (nav.indexOf("zh") === 0 ? "zh" : "en");
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        } catch (e) {
          // ignore
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
