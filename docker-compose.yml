name: agentforge

# ──────────────────────────────────────────────────────────────
#  AgentForge local stack
#  ──────────────────────────────────────────────────────────────
#  Bring everything up with:
#      docker compose up --build
#
#  Exposed endpoints:
#      frontend   → http://localhost:5173  (Nginx static build + API/WS proxy)
#      api        → http://localhost:8000  (FastAPI)
#      api/docs   → http://localhost:8000/docs  (Swagger UI)
#      qdrant     → http://localhost:6333  (REST API + dashboard)
#
#  Notes
#  ─────
#  * The sandbox container is *not* a privileged docker-in-docker
#    runner.  Agent tools can shell-out to `docker run` against the
#    shared docker socket and execute untrusted code inside a fresh
#    throwaway container.  This is the safest default on Linux/macOS
#    hosts.  On Windows / Docker Desktop, mount the socket only if you
#    understand the security implications.
#  * If you don't need persistent vector memory, remove the `qdrant`
#    dependency/service and set `AGENTFORGE_VECTOR_BACKEND=inprocess`.
#  * Secrets (OpenAI / Anthropic keys) are read from your shell env at
#    compose-time.  They are never baked into the image.
# ──────────────────────────────────────────────────────────────

x-common-env: &common-env
  AGENTFORGE_DATABASE_URL: ${AGENTFORGE_DATABASE_URL:-postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge}
  AGENTFORGE_LLM_PROVIDER: ${AGENTFORGE_LLM_PROVIDER:-mock}
  AGENTFORGE_TASK_BACKEND: ${AGENTFORGE_TASK_BACKEND:-celery}
  AGENTFORGE_CONTROL_BACKEND: ${AGENTFORGE_CONTROL_BACKEND:-redis}
  AGENTFORGE_REDIS_URL: ${AGENTFORGE_REDIS_URL:-redis://redis:6379/0}
  AGENTFORGE_API_TOKEN: ${AGENTFORGE_API_TOKEN:-}
  AGENTFORGE_AUTH_ENABLED: ${AGENTFORGE_AUTH_ENABLED:-true}
  AGENTFORGE_SECRET_KEY: ${AGENTFORGE_SECRET_KEY:?Set a strong AGENTFORGE_SECRET_KEY in .env}
  AGENTFORGE_ENABLE_DANGEROUS_TOOLS: ${AGENTFORGE_ENABLE_DANGEROUS_TOOLS:-false}
  AGENTFORGE_FILE_ALLOWED_DIRS: ${AGENTFORGE_FILE_ALLOWED_DIRS:-[]}
  AGENTFORGE_HTTP_ALLOWED_HOSTS: ${AGENTFORGE_HTTP_ALLOWED_HOSTS:-[]}
  AGENTFORGE_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AGENTFORGE_OPENAI_MODEL: ${AGENTFORGE_OPENAI_MODEL:-gpt-4o-mini}
  AGENTFORGE_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AGENTFORGE_ANTHROPIC_MODEL: ${AGENTFORGE_ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
  AGENTFORGE_MAX_STEPS: ${AGENTFORGE_MAX_STEPS:-10}
  AGENTFORGE_MAX_TOKENS: ${AGENTFORGE_MAX_TOKENS:-8000}
  # Vector memory
  AGENTFORGE_VECTOR_BACKEND: ${AGENTFORGE_VECTOR_BACKEND:-qdrant}
  AGENTFORGE_VECTOR_URL: http://qdrant:6333
  AGENTFORGE_EMBEDDING_PROVIDER: ${AGENTFORGE_EMBEDDING_PROVIDER:-hashing}
  AGENTFORGE_EMBEDDING_MODEL: ${AGENTFORGE_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
  # Sandbox
  AGENTFORGE_SANDBOX_MODE: ${AGENTFORGE_SANDBOX_MODE:-docker}
  AGENTFORGE_SANDBOX_REQUIRED: ${AGENTFORGE_SANDBOX_REQUIRED:-true}
  AGENTFORGE_SANDBOX_NETWORK_DISABLED: ${AGENTFORGE_SANDBOX_NETWORK_DISABLED:-true}
  AGENTFORGE_SANDBOX_IMAGE: ${AGENTFORGE_SANDBOX_IMAGE:-agentforge-sandbox}
  AGENTFORGE_SANDBOX_NETWORK: agentforge_agentforge-net

services:

  # Run schema migrations exactly once before API/worker startup.
  migrate:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    image: agentforge-api:dev
    container_name: agentforge-migrate
    command: ["python", "-c", "import asyncio; from app.database import init_db; asyncio.run(init_db())"]
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: *common-env
      AGENTFORGE_RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agentforge-net

  # ─── 1. FastAPI backend (the brain) ─────────────────────────
  agentforge-api:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    image: agentforge-api:dev
    container_name: agentforge-api
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:-999}"
    # .env 文件是可选的：如果项目根目录有 .env 则读取，没有也不报错
    # （所有变量都在下面 x-common-env 里给了默认值）。
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: *common-env
      AGENTFORGE_RUN_MIGRATIONS: "false"
    volumes:
      # Persist uploaded files across restarts (PostgreSQL has its own volume).
      - ./data:/app/data
      # Allow the api to spawn sibling sandbox containers via the host
      # docker socket.  Comment out the next line for a "no docker
      # access" deployment.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; \
        sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      agentforge-sandbox:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - agentforge-net

  # ─── 2. React dev server (Vite) ─────────────────────────────
  agentforge-frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_API_TOKEN: ${AGENTFORGE_API_TOKEN:-}
    image: agentforge-frontend:dev
    container_name: agentforge-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      agentforge-api:
        condition: service_healthy
    networks:
      - agentforge-net

  # ─── 3. Sandbox (where agent-generated code actually runs) ───
  agentforge-sandbox:
    # Tiny Python 3.11 base image.  The FastAPI service spawns short
    # -lived `docker run --rm agentforge-sandbox …` invocations against
    # the host docker socket to execute untrusted code; this container
    # is the *template* image, not a long-running daemon.  The
    # `command:` below keeps a placeholder process so `docker compose
    # up` doesn't immediately exit.  Feel free to remove it once you
    # start running real tool calls.
    image: ${AGENTFORGE_SANDBOX_IMAGE:-agentforge-sandbox}
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: agentforge-sandbox
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /workspace:size=64m
      - /tmp:size=64m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    networks:
      - agentforge-net
    command: ["python", "-c", "print('AgentForge sandbox template image ready')"]

  # Redis: Celery broker plus cross-worker controls and pub/sub.
  redis:
    image: redis:7-alpine
    container_name: agentforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - agentforge-net

  # Durable execution happens here, not in API BackgroundTasks.
  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    image: agentforge-api:dev
    container_name: agentforge-celery-worker
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:-999}"
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: *common-env
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      agentforge-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentforge-net

  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    image: agentforge-api:dev
    container_name: agentforge-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=INFO"]
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: *common-env
    depends_on:
      agentforge-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentforge-net

  # ─── 4. PostgreSQL (durable application state) ──────────────
  postgres:
    image: postgres:16-alpine
    container_name: agentforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentforge}
      POSTGRES_DB: ${POSTGRES_DB:-agentforge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agentforge-net

  # ─── 5. Qdrant (persistent vector memory) ───────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: agentforge-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - agentforge-net

volumes:
  redis-data:
    name: agentforge-redis-data
  postgres-data:
    name: agentforge-postgres-data
  qdrant-data:
    name: agentforge-qdrant-data

networks:
  agentforge-net:
    name: agentforge-net
    driver: bridge